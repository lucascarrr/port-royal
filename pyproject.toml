[project]
name = "port-royal"
version = "0.1.0"
description = "Formal Concept Analysis with Preferential Semantics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bitarray>=2.8.0",
]

[project.scripts]
port-royal = "portroyal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portroyal"]
